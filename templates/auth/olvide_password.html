{% extends "auth/_base_auth.html" %}
{% block title %}Recuperar acceso{% endblock %}
{% block content %}
<h1>Recuperar acceso</h1>
<p class="muted">Te enviamos un enlace para crear una contraseña nueva. Vale por 30 minutos.</p>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <label>Correo
    <input type="email" name="correo" autocomplete="username" maxlength="150" required autofocus />
  </label>
  <button class="btn btn--primario" type="submit">Enviar enlace</button>
</form>
<p class="pie"><a href="{{ url_for('auth.login') }}">Volver a iniciar sesión</a></p>
{% endblock %}
