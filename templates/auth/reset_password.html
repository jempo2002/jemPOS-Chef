{% extends "auth/_base_auth.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
<h1>Nueva contraseña</h1>
<p class="muted">Mínimo 8 caracteres, con una mayúscula, una minúscula y un número.</p>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <label>Contraseña nueva
    <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required autofocus />
  </label>
  <label>Repítela
    <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="128" required />
  </label>
  <button class="btn btn--primario" type="submit">Guardar</button>
</form>
{% endblock %}
